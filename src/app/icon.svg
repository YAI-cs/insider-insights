  <path d="M21 5 L27 5 L27 11" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="square"/>
  <path d="M5 21 L5 27 L11 27" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="square"/>
  <path d="M21 27 L27 27 L27 21" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="square"/>

  <!-- Orbit ellipse (tilted) -->
